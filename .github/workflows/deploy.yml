name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one midway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stamp the service worker with this commit
        # Without this the service worker keeps serving the previous bundle
        # from its cache-first store, and deploys never reach returning users.
        run: node tools/stamp-version.mjs "${GITHUB_SHA}"

      - name: Remove development-only files from the artifact
        run: rm -rf node_modules test test-results playwright-report .github

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
