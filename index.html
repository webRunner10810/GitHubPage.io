<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Summary — AI Meeting Notes</title>
<meta name="description" content="Record meetings and calls, transcribe them live, and turn them into summaries, decisions and action items.">
<meta name="theme-color" content="#0b0f14">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Summary">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="back-btn" type="button" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="topbar-title" id="topbar-title">Summary</h1>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>

  <main class="view" id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a class="tab" href="#/record" data-tab="record">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      <span>Record</span>
    </a>
    <a class="tab" href="#/library" data-tab="library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 5v14"/><path d="M12 9h5M12 13h5"/></svg>
      <span>Library</span>
    </a>
    <a class="tab" href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      <span>Settings</span>
    </a>
  </nav>
</div>

<div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>
<div class="sheet-host" id="sheet-host" hidden></div>

<noscript>
  <p style="padding:24px;color:#e6edf3">Summary needs JavaScript to record and transcribe audio.</p>
</noscript>

<script type="module" src="./js/app.js"></script>
</body>
</html>
